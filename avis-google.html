<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Avis Google</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: white;
      margin: 0;
      padding: 10px;
    }

    .review {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .author {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .stars {
      color: #f4b400;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .date {
      font-size: 0.85em;
      color: #666;
      margin-bottom: 6px;
    }

    .text {
      font-size: 0.95em;
      line-height: 1.4;
    }

    .error {
      color: #b00020;
      padding: 10px;
      background: #fff3f3;
      border-radius: 6px;
    }

    .google-badge {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 999;
      font-size: 0.95em;
      color: #555;
      background: rgba(255, 255, 255, 0.90);
      border-radius: 8px;
      padding: 6px 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .google-badge img {
      height: 18px;
      width: 18px;
      vertical-align: middle;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div id="reviews">
    Chargement des avis…
  </div>


  <div class="google-badge">
    <img
      src="https://png.pngtree.com/png-clipart/20230916/original/pngtree-google-logo-vector-png-image_12256710.png"
      alt="Google"
    >
    <span>Avis Google</span>
  </div>


  <script>
    // ID Google Maps de l'établissement
    const placeId = "ChIJ8Ubf59MB5kcRn-haO9o6gNs";


    function formatDate(timestamp) {
      const date = new Date(timestamp * 1000);

      return date.toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }


    function initMap() {

      console.log("Google Maps chargé.");

      const reviewsContainer = document.getElementById("reviews");

      const service = new google.maps.places.PlacesService(
        document.createElement("div")
      );


      service.getDetails(
        {
          placeId: placeId,
          fields: [
            "name",
            "rating",
            "user_ratings_total",
            "reviews"
          ]
        },

        function(place, status) {

          console.log("Google Places status :", status);
          console.log("Données reçues :", place);


          // -----------------------------
          // ERREUR GOOGLE
          // -----------------------------

          if (status !== google.maps.places.PlacesServiceStatus.OK) {

            reviewsContainer.innerHTML = `
              <div class="error">
                <strong>Impossible de charger les avis.</strong>
                <br><br>
                Erreur Google Places :
                <strong>${status}</strong>
              </div>
            `;

            console.error(
              "Erreur Google Places :",
              status
            );

            return;
          }


          // -----------------------------
          // AUCUN AVIS
          // -----------------------------

          if (
            !place.reviews ||
            place.reviews.length === 0
          ) {

            reviewsContainer.innerHTML = `
              <div class="error">
                Aucun avis n'a été retourné par Google
                pour cet établissement.
              </div>
            `;

            console.warn(
              "Google n'a retourné aucun avis."
            );

            return;
          }


          // -----------------------------
          // AFFICHAGE DES AVIS
          // -----------------------------

          let html = "";


          place.reviews
            .slice(0, 5)
            .forEach(function(review) {

              const rating =
                Math.max(
                  0,
                  Math.min(
                    5,
                    Math.round(review.rating || 0)
                  )
                );


              const stars =
                "★".repeat(rating) +
                "☆".repeat(5 - rating);


              html += `
                <div class="review">

                  <div class="author">
                    🧑 ${escapeHtml(
                      review.author_name || "Utilisateur Google"
                    )}
                  </div>

                  <div class="stars">
                    ${stars}
                  </div>

                  <div class="date">
                    📆 ${formatDate(review.time)}
                  </div>

                  <div class="text">
                    💬 ${escapeHtml(review.text || "")}
                  </div>

                </div>
              `;
            });


          reviewsContainer.innerHTML = html;
        }
      );
    }


    // Protection pour éviter qu'un texte provenant
    // d'un avis soit interprété comme du HTML.
    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }


    // Si Google Maps ne parvient même pas à charger
    window.gm_authFailure = function() {

      console.error(
        "Échec d'authentification Google Maps."
      );

      document.getElementById("reviews").innerHTML = `
        <div class="error">
          <strong>Erreur d'authentification Google Maps.</strong>
          <br><br>
          Vérifie la clé API, ses restrictions,
          les API activées et la facturation Google Cloud.
        </div>
      `;
    };
  </script>


  <!--
    IMPORTANT :
    Remplace TA_NOUVELLE_CLE_API par ta nouvelle clé Google Maps.
    Ne réutilise pas la clé que tu as publiée précédemment.
  -->

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAV8Zz7HW07g-0f3zYwF0MV4b3X4fpko-A&libraries=places&callback=initMap">
  </script>

</body>
</html>
